name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy matplotlib

      - name: Run inventory simulation (short horizon)
        run: python python/inventory_simulation.py --reps 10 --horizon 120

      - name: Demand classification & budget tests
        run: |
          python tests/test_demand_classification.py
          python tests/test_inventory_budget.py

      - name: Check outputs
        run: |
          test -f results/simulation_summary.csv
          test -f results/service_level_frontier.csv
          test -f images/cost_service_frontier.png

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install network dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy matplotlib pulp

      - name: Compile network module
        working-directory: network_mip
        run: python -m compileall -q src scripts

      - name: Network tests
        working-directory: network_mip
        run: python -m unittest discover -s tests -v

      - name: Network solve
        working-directory: network_mip
        run: python scripts/solve.py

      - name: Stochastic network
        working-directory: network_mip
        run: python scripts/stochastic.py --scenarios 4 --capacity-scales 1.0,0.35
